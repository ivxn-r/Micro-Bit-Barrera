<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Micro:Bit Servomotor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 80%;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .danger { background-color: #ef4444; }
        .danger:hover { background-color: #dc2626; }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control Servomotor Micro:Bit</h2>
        <button id="connectBtn">Conectar Micro:Bit</button>
        <br>
        <button id="openBtn" disabled>Girar a 180° (Abrir)</button>
        <button id="closeBtn" class="danger" disabled>Girar a 0° (Cerrar)</button>
        <div id="status">Desconectado</div>
    </div>

    <script>
        // UUIDs estándar del servicio UART de Micro:Bit
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // Para enviar datos a la microbit

        let bluetoothDevice = null;
        let uartCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = "Buscando Micro:Bit...";
                
                // Solicitar dispositivo Bluetooth filtrando por nombre que empiece con BBC micro:bit
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                statusDiv.textContent = "Conectando al servidor GATT...";
                const server = await bluetoothDevice.gatt.connect();

                statusDiv.textContent = "Buscando servicio UART...";
                const service = await server.getPrimaryService(UART_SERVICE_UUID);

                statusDiv.textContent = "Obteniendo característica...";
                uartCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                statusDiv.textContent = "¡Conectado exitosamente!";
                connectBtn.textContent = "Conectado";
                connectBtn.disabled = true;
                openBtn.disabled = false;
                closeBtn.disabled = false;

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error: " + error.message;
            }
        });

        async function sendCommand(cmd) {
            if (!uartCharacteristic) return;
            try {
                // Micro:Bit UART espera el comando seguido de un salto de línea (\n)
                const encoder = new TextEncoder();
                const data = encoder.encode(cmd + '\n');
                await uartCharacteristic.writeValue(data);
                statusDiv.textContent = `Comando enviado: ${cmd}`;
            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error al enviar comando";
            }
        }

        openBtn.addEventListener('click', () => sendCommand('abrir'));
        closeBtn.addEventListener('click', () => sendCommand('cerrar'));

        function onDisconnected() {
            statusDiv.textContent = "Dispositivo desconectado.";
            connectBtn.textContent = "Conectar Micro:Bit";
            connectBtn.disabled = false;
            openBtn.disabled = true;
            closeBtn.disabled = true;
            uartCharacteristic = null;
            bluetoothDevice = null;
        }
    </script>
</body>
</html>
