<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Micro:Bit Servomotor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 0.5rem 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .danger { background-color: #ef4444; }
        .danger:hover { background-color: #dc2626; }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control Servo Micro:Bit</h2>
        <button id="connectBtn">Conectar Micro:Bit</button>
        <hr style="border-color: #334155; margin: 1rem 0;">
        <button id="openBtn" disabled>Girar a 180° (Abrir)</button>
        <button id="closeBtn" class="danger" disabled>Girar a 0° (Cerrar)</button>
        <div id="status">Estado: Desconectado</div>
    </div>

    <script>
        // UUIDs oficiales del Servicio UART de Micro:Bit
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        // RX Characteristic (6e400002) es donde la Micro:Bit RECIBE nuestros datos
        const UART_RX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

        let bluetoothDevice = null;
        let rxCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = "Buscando Micro:Bit...";
                
                // Pedimos el dispositivo con el prefijo estándar 'BBC micro:bit'
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                statusDiv.textContent = "Conectando al servidor GATT...";
                const server = await bluetoothDevice.gatt.connect();

                statusDiv.textContent = "Accediendo al Servicio UART...";
                const service = await server.getPrimaryService(UART_SERVICE_UUID);

                statusDiv.textContent = "Accediendo a la característica RX...";
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                statusDiv.textContent = "Estado: ¡Conectado exitosamente!";
                connectBtn.textContent = "Conectado";
                connectBtn.disabled = true;
                openBtn.disabled = false;
                closeBtn.disabled = false;

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error de conexión: " + error.message;
            }
        });

        async function sendCommand(cmd) {
            if (!rxCharacteristic) {
                statusDiv.textContent = "Error: No hay conexión establecida.";
                return;
            }
            try {
                // Enviamos el comando terminado en \r\n para la Micro:Bit
                const encoder = new TextEncoder();
                const data = encoder.encode(cmd + '\r\n');
                await rxCharacteristic.writeValue(data);
                statusDiv.textContent = `Enviado: "${cmd}"`;
            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error al enviar: " + error.message;
            }
        }

        openBtn.addEventListener('click', () => sendCommand('abrir'));
        closeBtn.addEventListener('click', () => sendCommand('cerrar'));

        function onDisconnected() {
            statusDiv.textContent = "Estado: Dispositivo desconectado.";
            connectBtn.textContent = "Conectar Micro:Bit";
            connectBtn.disabled = false;
            openBtn.disabled = true;
            closeBtn.disabled = true;
            rxCharacteristic = null;
            bluetoothDevice = null;
        }
    </script>
</body>
</html>
