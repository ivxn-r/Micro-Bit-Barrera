<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Servo Micro:Bit v1.5</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.8rem 1.2rem;
            margin: 0.5rem 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
        }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .danger { background-color: #dc2626; }
        #status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #94a3b8;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control Servo Micro:Bit</h2>
        <button id="connectBtn">1. Conectar Bluetooth</button>
        <hr style="border-color: #334155; margin: 1.2rem 0;">
        <button id="openBtn" disabled>Abrir (180°)</button>
        <button id="closeBtn" class="danger" disabled>Cerrar (0°)</button>
        <div id="status">Estado: Desconectado</div>
    </div>

    <script>
       // UUIDs del Servicio IO PIN
const IO_PIN_SERVICE_UUID = 'e95d127b-251d-470a-a062-fa1922dfa9a8';
const PIN_DATA_UUID       = 'e95d8d00-251d-470a-a062-fa1922dfa9a8';
const PIN_AD_CONFIG_UUID  = 'e95d589e-251d-470a-a062-fa1922dfa9a8'; // Analog/Digital Config

let pinDataChar = null;

const connectBtn = document.getElementById('connectBtn');
const openBtn = document.getElementById('openBtn');
const closeBtn = document.getElementById('closeBtn');
const statusDiv = document.getElementById('status');

connectBtn.addEventListener('click', async () => {
    try {
        statusDiv.textContent = "Buscando Micro:Bit...";
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'BBC micro:bit' }],
            optionalServices: [IO_PIN_SERVICE_UUID]
        });

        statusDiv.textContent = "Conectando al servidor GATT...";
        const server = await device.gatt.connect();

        statusDiv.textContent = "Obteniendo Servicio IO Pin...";
        const service = await server.getPrimaryService(IO_PIN_SERVICE_UUID);

        // 1. Configurar P0 en modo Analógico/PWM (bit 0 en 1)
        const adConfigChar = await service.getCharacteristic(PIN_AD_CONFIG_UUID);
        // Bitmask: Pin 0 = Analog (1)
        const adConfig = new Uint32Array([0x00000001]); 
        await adConfigChar.writeValue(adConfig);

        // 2. Obtenemos la característica para enviar el valor del pin
        pinDataChar = await service.getCharacteristic(PIN_DATA_UUID);

        statusDiv.textContent = "Estado: ¡Conectado y configurado!";
        connectBtn.textContent = "Conectado";
        connectBtn.disabled = true;
        openBtn.disabled = false;
        closeBtn.disabled = false;

    } catch (error) {
        console.error(error);
        statusDiv.textContent = "Error: " + error.message;
    }
});

async function writePinValue(pin, value) {
    if (!pinDataChar) return;

    // Estructura de PinData: [Pin (1 byte), Value (1 byte)]
    const buffer = new Uint8Array([pin, value]);

    try {
        await pinDataChar.writeValue(buffer);
        statusDiv.textContent = `Pin P${pin} enviado valor: ${value}`;
    } catch (error) {
        console.error(error);
        statusDiv.textContent = "Error al escribir en Pin: " + error.message;
    }
}

// En analog write (0-255): 0° suele ser ~25 y 180° suele ser ~128
openBtn.addEventListener('click', () => writePinValue(0, 128));
closeBtn.addEventListener('click', () => writePinValue(0, 25));
    </script>
</body>
</html>
