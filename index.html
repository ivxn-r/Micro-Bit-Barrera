<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control Servo - micro:bit</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #111827;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;

            background: #1f2937;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.4);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .status {
            padding: 12px;

            border-radius: 10px;

            background: #374151;

            margin-bottom: 25px;

            font-weight: bold;
        }

        .connected {
            background: #166534;
        }

        .disconnected {
            background: #7f1d1d;
        }

        button {
            border: none;

            padding: 13px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            background: #2563eb;

            color: white;

            margin: 5px;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            background: #1d4ed8;
        }

        button:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
        }

        .angle {
            font-size: 55px;

            font-weight: bold;

            margin: 25px 0;
        }

        input[type="range"] {
            width: 100%;

            cursor: pointer;
        }

        .range-labels {
            display: flex;

            justify-content: space-between;

            color: #9ca3af;

            margin-top: 8px;
        }

        .presets {
            margin-top: 25px;
        }

        .disconnect {
            background: #dc2626;
        }

        .disconnect:hover {
            background: #b91c1c;
        }

        .info {
            margin-top: 25px;

            color: #9ca3af;

            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 Control del Servo</h1>

    <div class="subtitle">
        micro:bit V1.5 · Bluetooth
    </div>

    <div id="status" class="status disconnected">
        🔴 Desconectado
    </div>

    <button id="connectButton">
        🔵 Conectar micro:bit
    </button>

    <div class="angle">
        <span id="angleValue">90</span>°
    </div>

    <input
        type="range"
        id="angleSlider"
        min="0"
        max="180"
        value="90"
    >

    <div class="range-labels">
        <span>0°</span>
        <span>90°</span>
        <span>180°</span>
    </div>

    <div class="presets">

        <button onclick="setAngle(0)">
            0°
        </button>

        <button onclick="setAngle(45)">
            45°
        </button>

        <button onclick="setAngle(90)">
            90°
        </button>

        <button onclick="setAngle(135)">
            135°
        </button>

        <button onclick="setAngle(180)">
            180°
        </button>

    </div>

    <br>

    <button
        id="disconnectButton"
        class="disconnect"
        disabled
    >
        🔴 Desconectar
    </button>

    <div class="info">
        Control inalámbrico mediante Bluetooth Low Energy
    </div>

</div>


<script>

    // UUID del servicio UART del micro:bit
    const UART_SERVICE_UUID =
        "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    // Característica utilizada para enviar datos
    // desde el navegador hacia el micro:bit
    const UART_TX_CHARACTERISTIC_UUID =
        "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


    let device = null;
    let server = null;
    let txCharacteristic = null;


    const connectButton =
        document.getElementById("connectButton");

    const disconnectButton =
        document.getElementById("disconnectButton");

    const status =
        document.getElementById("status");

    const slider =
        document.getElementById("angleSlider");

    const angleValue =
        document.getElementById("angleValue");


    // ------------------------------
    // CONECTAR
    // ------------------------------

    connectButton.addEventListener("click", async () => {

        try {

            if (!navigator.bluetooth) {

                alert(
                    "Tu navegador no soporta Web Bluetooth."
                );

                return;
            }


            status.textContent =
                "🟡 Buscando micro:bit...";

            status.className = "status";


            device = await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        services: [UART_SERVICE_UUID]
                    }
                ]

            });


            device.addEventListener(
                "gattserverdisconnected",
                disconnected
            );


            status.textContent =
                "🟡 Conectando...";


            server =
                await device.gatt.connect();


            const service =
                await server.getPrimaryService(
                    UART_SERVICE_UUID
                );


            txCharacteristic =
                await service.getCharacteristic(
                    UART_TX_CHARACTERISTIC_UUID
                );


            status.textContent =
                "🟢 micro:bit conectado";

            status.className =
                "status connected";


            connectButton.disabled = true;

            disconnectButton.disabled = false;

            slider.disabled = false;


            // Enviar el ángulo inicial
            await sendAngle(
                parseInt(slider.value)
            );


        } catch (error) {

            console.error(error);

            status.textContent =
                "🔴 Error de conexión";

            status.className =
                "status disconnected";

            alert(
                "No se pudo conectar al micro:bit.\n\n" +
                error
            );
        }

    });


    // ------------------------------
    // SLIDER
    // ------------------------------

    slider.addEventListener("input", async () => {

        const angle =
            parseInt(slider.value);

        angleValue.textContent =
            angle;

        await sendAngle(angle);

    });


    // ------------------------------
    // CAMBIAR ÁNGULO
    // ------------------------------

    async function setAngle(angle) {

        slider.value = angle;

        angleValue.textContent = angle;

        await sendAngle(angle);

    }


    // ------------------------------
    // ENVIAR ÁNGULO
    // ------------------------------

    async function sendAngle(angle) {

        if (!txCharacteristic) {
            return;
        }

        try {

            // El micro:bit espera:
            // "90\n"
            const data =
                new TextEncoder().encode(
                    angle + "\n"
                );

            await txCharacteristic.writeValue(data);

        } catch (error) {

            console.error(
                "Error enviando:",
                error
            );

        }

    }


    // ------------------------------
    // DESCONECTAR
    // ------------------------------

    disconnectButton.addEventListener(
        "click",
        () => {

            if (
                device &&
                device.gatt.connected
            ) {

                device.gatt.disconnect();

            }

        }
    );


    // ------------------------------
    // EVENTO DESCONEXIÓN
    // ------------------------------

    function disconnected() {

        status.textContent =
            "🔴 Desconectado";

        status.className =
            "status disconnected";

        connectButton.disabled = false;

        disconnectButton.disabled = true;

        txCharacteristic = null;

    }

</script>

</body>
</html>
